# Trusted CI bridge. Public workflow executes the canonical private suite with redacted diagnostics.
# Important: never add pull_request or untrusted triggers here, as the job
# uses a private-repository checkout token. Logs are intentionally redacted.
name: Private Shift Planner CI

on:
  workflow_dispatch:
    inputs:
      private_sha:
        description: 'SHA completo (40 caratteri) del commit privato da testare; vuoto = main'
        required: false
        type: string
  # The public repository cannot receive private PR events safely. A daily
  # trusted run checks the latest private main without exposing credentials.
  schedule:
    - cron: '17 6 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/private-shift-planner-ci.yml'

permissions:
  contents: read

concurrency:
  # Independent commits must never cancel or supersede a pinned validation.
  group: private-shift-planner-ci-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate trusted private commit selector
        env:
          PRIVATE_SHA: ${{ inputs.private_sha || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$PRIVATE_SHA" ] && ! [[ "$PRIVATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Only a complete 40-character private commit SHA is permitted."
            exit 1
          fi
      - name: Check out private Shift Planner selected commit
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.SHIFT_PLANNER_REPO }}
          # Scheduled runs use private main; manual runs may pin an exact SHA.
          # Never accept branch or PR refs as manual input.
          ref: ${{ inputs.private_sha || 'main' }}
          token: ${{ secrets.SHIFT_PLANNER_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify test manifest and private checkout
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/test-runner.js
          test -f .github/workflows/node-tests.yml
          # Fail closed if the private canonical CI was changed without
          # updating this public bridge: never silently lose new tests.
          expected="819f5ee14a5270080b4f3cfa2738ea5af1d1214c"
          actual="$(git hash-object .github/workflows/node-tests.yml)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::Private test manifest changed: update this public CI mirror before certifying G0."
            exit 1
          fi
          echo "Private checkout and test manifest: PASS"

      - name: Run repository suite
        continue-on-error: true
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "Check 001" >> "$RUNNER_TEMP/shiftplanner-ci-failures"; echo "::error::Private check failed; test output withheld."; grep -Eo "tests/[A-Za-z0-9_./-]+\\.js:[0-9]+:[0-9]+" "$RUNNER_TEMP/shiftplanner-ci-001.log" | head -n 3 || true' ERR
          if node tests/test-runner.js > "$RUNNER_TEMP/shiftplanner-ci-001.log" 2>&1; then
            echo "Repository suite: PASS"
          else
            echo "::error::Repository suite failed. Only failing test IDs are shown (no private output)."
            awk '/^FAIL / {sub(/ - .*/, "", $0);print}' "$RUNNER_TEMP/shiftplanner-ci-001.log" | head -n 30
            if ! grep -q '^FAIL ' "$RUNNER_TEMP/shiftplanner-ci-001.log"; then
              echo "::error::Failure before test reporting. Full stack trace withheld."
            fi
            echo "Check 001" >> "$RUNNER_TEMP/shiftplanner-ci-failures"
            exit 1
          fi

      - name: Run focused M4-003 suite
        continue-on-error: true
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "Check 002" >> "$RUNNER_TEMP/shiftplanner-ci-failures"; echo "::error::Private check failed; test output withheld."; grep -Eo "tests/[A-Za-z0-9_./-]+\\.js:[0-9]+:[0-9]+" "$RUNNER_TEMP/shiftplanner-ci-002.log" | head -n 3 || true' ERR
          node tests/m4-003-node-runner.js > "$RUNNER_TEMP/shiftplanner-ci-002.log" 2>&1
          echo "PASS"

      - name: Run focused M4-004 suite
